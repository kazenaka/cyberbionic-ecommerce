<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberShop | Курсовой проект</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6', // Синий цвет для кнопок
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col">

    <header class="bg-white shadow-md sticky top-0 z-50">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <a href="#" class="text-2xl font-bold text-primary flex items-center gap-2" id="nav-logo">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                CyberShop
            </a>

            <nav class="hidden md:flex gap-6 items-center" id="nav-menu">
                <a href="#catalog" class="hover:text-primary transition font-medium">Каталог</a>
                
                <div id="auth-guest" class="flex gap-4">
                    <a href="#login" class="text-gray-600 hover:text-primary transition">Войти</a>
                    <a href="#register" class="bg-primary text-white px-4 py-2 rounded-lg hover:bg-blue-600 transition shadow">Регистрация</a>
                </div>

                <div id="auth-user" class="hidden flex gap-4 items-center">
                    <a href="#cart" class="relative text-gray-600 hover:text-primary transition">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                        <span id="cart-badge" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs font-bold px-1.5 py-0.5 rounded-full hidden">0</span>
                    </a>
                    <a href="#profile" class="hover:text-primary transition font-medium">Личный кабинет</a>
                    <button id="logout-btn" class="text-sm text-red-500 hover:text-red-700 transition">Выйти</button>
                </div>
            </nav>
        </div>
    </header>

    <main class="flex-grow container mx-auto px-4 py-8" id="app-root">
        <div class="flex justify-center items-center h-64">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-primary"></div>
        </div>
    </main>

    <footer class="bg-gray-800 text-gray-300 py-6 mt-auto">
        <div class="container mx-auto px-4 text-center">
            <p>&copy; 2023-2024 CyberShop. Курсовой проект CyberBionic Systematics.</p>
        </div>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/components.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
